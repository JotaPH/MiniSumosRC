<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiniSumos RC · Contador de ataques</title>
<style>
:root{color-scheme:dark;--cyan:#49eaff;--white:#f5fbff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;width:100%;background:radial-gradient(ellipse at 50% 20%,#10304a 0,#061321 45%,#020710 100%);color:var(--white);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:24px}
.fullscreen{position:fixed;z-index:10;left:clamp(12px,1.6vw,24px);top:clamp(12px,1.6vw,24px);width:48px;height:48px;display:grid;place-items:center;border:1px solid #78dfffaa;border-radius:14px;background:#061525e8;color:white;font-size:26px;cursor:pointer;box-shadow:0 4px 20px #0008}.fullscreen:hover{border-color:var(--cyan);box-shadow:0 0 22px #32dfff55}.fullscreen #fullscreenIcon{display:flex;align-items:center;justify-content:center;width:100%;height:100%;line-height:1}.fullscreen .icon-expand{display:block}.fullscreen .icon-exit{display:none;width:23px;height:23px;overflow:visible}.fullscreen.is-fullscreen .icon-expand{display:none}.fullscreen.is-fullscreen .icon-exit{display:block}
.gear{position:fixed;z-index:10;right:clamp(12px,1.6vw,24px);top:clamp(12px,1.6vw,24px);width:48px;height:48px;display:grid;place-items:center;border:1px solid #78dfffaa;border-radius:14px;background:#061525e8;color:white;font-size:24px;cursor:pointer;box-shadow:0 4px 20px #0008;transition:.2s}
.gear:hover{border-color:var(--cyan);box-shadow:0 0 22px #32dfff55;transform:rotate(25deg)}
#quickMenu{position:fixed;z-index:20;top:calc(clamp(12px,1.6vw,24px) + 56px);right:clamp(12px,1.6vw,24px);width:min(250px,calc(100vw - 24px));padding:9px;display:flex;flex-direction:column;gap:7px;border:1px solid #50dfff90;border-radius:14px;background:#04101bf7;box-shadow:0 16px 45px #000b}
#quickMenu[hidden]{display:none}#quickMenu button{min-height:48px;padding:12px;border:1px solid #31536f;border-radius:9px;background:#0a2135;color:#f4fbff;font-size:13px;font-weight:900;letter-spacing:1px;text-align:left;cursor:pointer}
#quickMenu button:hover{background:linear-gradient(100deg,#19c9f4,#83f1ff);color:#03101a}
.page{width:min(900px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:clamp(18px,4vw,42px);border:1px solid #50dfff55;border-radius:28px;background:linear-gradient(145deg,#071827ee,#030b15f5);box-shadow:0 25px 80px #0008,0 0 40px #00cfff12}
.kicker{font-weight:900;font-size:12px;letter-spacing:4px;color:#80dfff}
h1{margin:0;font-size:clamp(27px,5vw,48px);letter-spacing:2px;text-transform:uppercase}
.robot{width:clamp(130px,25vw,240px);height:clamp(130px,25vw,240px);object-fit:contain;filter:drop-shadow(0 16px 25px #000a)}
.name{font-size:clamp(24px,4vw,38px);font-weight:1000;text-transform:uppercase;text-shadow:0 0 18px var(--robot-color)}
.count{font-size:clamp(76px,16vw,150px);line-height:.95;font-weight:1000;font-variant-numeric:tabular-nums;text-shadow:0 0 24px var(--robot-color);margin:6px 0}
.unit{font-size:13px;font-weight:900;letter-spacing:4px;color:#9cb8cb}
.buttons{width:min(620px,100%);display:grid;grid-template-columns:1fr 2fr;align-items:center;gap:14px;margin-top:10px}
button.action{height:60px;min-height:60px;border:1px solid #426782;border-radius:16px;background:#102b40;color:#fff;font-size:clamp(17px,3vw,24px);font-weight:1000;cursor:pointer;transition:transform .15s,filter .15s}
button.action:active:not(:disabled){transform:scale(.98)}
button.action.add{height:120px;min-height:120px;border:0;background:linear-gradient(110deg,#0bb9e7,#70efff);color:#03101a;font-size:clamp(20px,3.4vw,30px);box-shadow:0 0 26px #0bb9e755}
button.action:disabled{opacity:.3;filter:grayscale(1);cursor:not-allowed}
.phase{padding:10px 18px;border:1px solid #31536f;border-radius:999px;color:#b9d2e4;font-size:12px;font-weight:900;letter-spacing:2px}
.phase.running{border-color:#42ffab;color:#7dffb7;box-shadow:0 0 18px #00ff8c20}
.back{margin-top:4px;color:#91cfe9;text-decoration:none;font-weight:800;font-size:13px}.back:hover{color:#fff}
@media(max-width:600px){body{padding:10px;padding-top:66px;padding-bottom:max(10px,env(safe-area-inset-bottom))}.page{width:100%;min-height:calc(100svh - 76px);justify-content:center;padding:20px 12px;border-radius:18px;gap:12px}.kicker{font-size:10px;letter-spacing:2px}h1{font-size:clamp(23px,7vw,34px)}.robot{width:clamp(105px,28vw,155px);height:clamp(105px,28vw,155px)}.name{font-size:clamp(22px,6vw,30px)}.count{font-size:clamp(68px,20vw,108px);margin:0}.unit{font-size:10px;letter-spacing:2px}.buttons{gap:10px;margin-top:4px}button.action{height:58px;min-height:58px;font-size:clamp(15px,4vw,19px);border-radius:12px}button.action.add{height:116px;min-height:116px;font-size:clamp(18px,5vw,24px)}.phase{font-size:10px;letter-spacing:1px;padding:9px 13px}.back{font-size:12px}}
@media(max-height:650px){body{padding-top:62px}.page{gap:8px;padding-top:12px;padding-bottom:12px}.robot{width:clamp(75px,16vh,125px);height:clamp(75px,16vh,125px)}.count{font-size:clamp(58px,13vh,92px)}button.action.add{height:88px;min-height:88px}button.action{height:44px;min-height:44px}}
@media(max-width:380px){.buttons{grid-template-columns:1fr 1.7fr;gap:7px}button.action{font-size:14px}button.action.add{font-size:17px}}
#quickMenu{z-index:20}#quickMenu button{width:100%}</style>
</head>
<body>
<button class="fullscreen" id="fullscreenToggle" type="button" aria-label="Activar pantalla completa" title="Pantalla completa"><span id="fullscreenIcon"><span class="icon-expand">⛶</span><svg class="icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v5 M4 4l6 6 M15 20h5v-5 M20 20l-6-6"/></svg></span></button>
<button class="gear" id="openMenu" type="button" title="Menú de secciones" aria-label="Menú de secciones">⚙</button><nav id="quickMenu" hidden aria-label="Cambiar sección"><button data-view="participants">PARTICIPANTES</button><button data-view="brackets">TABLAS</button><button data-view="battles">BATALLAS</button><button data-view="attack1">ATAQUES 1</button><button data-view="attack2">ATAQUES 2</button></nav><main class="page" style="--robot-color:{{ '#ffe34d' if robot == 1 else '#c28cff' }}">
<div class="kicker">MINISUMOS RC · PANEL DE ATAQUES</div>
<h1>Control de ataques</h1>
<img class="robot" id="robotImage" src="{{ '/Imagenes/R_Amarillo.png' if robot == 1 else '/Imagenes/R_Morado.png' }}" alt="Robot">
<div class="name" id="robotName">CARGANDO...</div>
<div class="count" id="attackCount">0</div>
<div class="unit">ATAQUES REGISTRADOS</div>
<div class="phase" id="phase">CARGANDO ESTADO...</div>
<div class="buttons">
<button class="action" id="removeAttack" disabled>− DISMINUIR</button>
<button class="action add" id="addAttack" disabled>＋ AUMENTAR</button>
</div>
<a class="back" href="/" id="backHome">← Volver a la arena principal</a>
</main>
<script>
const ROBOT={{ robot }};
const $=id=>document.getElementById(id);
async function toggleFullscreen(){if(window.parent!==window){window.parent.postMessage({type:'toggleAttackFullscreen'},window.location.origin);return}try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else{await document.exitFullscreen()}}catch(e){alert('El navegador no permitió la pantalla completa. Prueba de nuevo con el botón ⛶.')}}
window.addEventListener('message',event=>{if(event.origin!==window.location.origin||!event.data||event.data.type!=='fullscreenState')return;const active=!!event.data.active;$('fullscreenToggle').classList.toggle('is-fullscreen',active);$('fullscreenToggle').title=active?'Salir de pantalla completa':'Pantalla completa';$('fullscreenToggle').setAttribute('aria-label',active?'Salir de pantalla completa':'Activar pantalla completa')});
window.addEventListener('load',()=>{if(window.parent!==window)window.parent.postMessage({type:'attackFullscreenState'},window.location.origin)});
$('fullscreenToggle').addEventListener('click',toggleFullscreen);$('openMenu').addEventListener('click',()=>{$('quickMenu').hidden=!$('quickMenu').hidden});$('quickMenu').querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.view;if(v==='home')location.href='/';else if(v==='battles')location.href='/battles';else if(v==='attack1')location.href='/attacks/1';else if(v==='attack2')location.href='/attacks/2';else location.href='/?section='+v}));
$('backHome').addEventListener('click',async event=>{event.preventDefault();if(window.parent!==window){window.parent.postMessage({type:'closeAttackView'},window.location.origin);return}try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}window.location.href='/'});
document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement;$('fullscreenToggle').classList.toggle('is-fullscreen',active);$('fullscreenToggle').title=active?'Salir de pantalla completa':'Pantalla completa';$('fullscreenToggle').setAttribute('aria-label',active?'Salir de pantalla completa':'Activar pantalla completa')});
async function api(path,method='GET'){const res=await fetch(path,{method,headers:{'Content-Type':'application/json'}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Error');return data}
function render(s){
 const one=ROBOT===1,name=one?s.robot1:s.robot2,count=one?s.attacks1:s.attacks2,image=one?s.robot1_image:s.robot2_image;
 $('robotName').textContent=name;$('attackCount').textContent=count;$('robotImage').src=image|| (one?'/Imagenes/R_Amarillo.png':'/Imagenes/R_Morado.png');
 const imageName=String(image||'').toLowerCase();
 const color=imageName.includes('amarillo')?'#ffe34d':imageName.includes('morado')?'#c28cff':imageName.includes('rojo')?'#ff5878':imageName.includes('verde')?'#63ffad':(one?'#ffe34d':'#c28cff');
 document.querySelector('.page').style.setProperty('--robot-color',color);
 const running=s.phase==='running';$('addAttack').disabled=!running;$('removeAttack').disabled=!running;
 $('phase').textContent=running?'BATALLA EN CURSO':s.phase==='paused'?'BATALLA PAUSADA':s.phase==='finished'?'BATALLA FINALIZADA':'ESPERANDO INICIO';
 $('phase').classList.toggle('running',running);
}
const events=new EventSource('/api/stream');events.onmessage=event=>{try{const message=JSON.parse(event.data);if(message.type==='state')render(message.data)}catch(e){}};
async function attack(action){try{render(await api(action==='add'?'/api/attack/'+ROBOT:'/api/attack/'+ROBOT+'/decrement','POST'))}catch(e){alert(e.message)}}
$('addAttack').addEventListener('click',()=>attack('add'));$('removeAttack').addEventListener('click',()=>attack('remove'));

// El flujo SSE entrega el estado inicial y las actualizaciones posteriores.
</script>
</body>
</html>
